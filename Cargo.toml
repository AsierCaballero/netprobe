[package]
name = "netprobe"
version = "0.1.0"
edition = "2024"
description = "Multi-target network probing TUI — concurrent ping, DNS, TCP connect"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full", "net", "time"] }
futures = "0.3"
ratatui = "0.28"
crossterm = "0.28"
hickory-resolver = "0.24"
ping = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"